<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPT-Erdos</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 24px;
        color: #111;
      }
      h1 {
        margin-bottom: 8px;
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin: 16px 0 24px;
      }
      .controls-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .status {
        color: #555;
        font-size: 14px;
      }
      .toast-status {
        position: fixed;
        right: 16px;
        bottom: 16px;
        background: rgba(17, 17, 17, 0.72);
        color: #fff;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        z-index: 20;
        pointer-events: none;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 150ms ease, transform 150ms ease;
      }
      .toast-status.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: auto;
      }
      .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      thead {
        position: sticky;
        top: 0;
        background: #f5f5f5;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        vertical-align: top;
        word-wrap: break-word;
      }
      th {
        text-align: left;
      }
      tbody tr:nth-child(even) {
        background: #fafafa;
      }
      .nowrap {
        white-space: nowrap;
      }
      .small {
        font-size: 12px;
        color: #666;
      }
      .textarea-cell {
        white-space: pre-line;
      }
      .latex-cell {
        white-space: pre-line;
      }
      .problem-col {
        min-width: 240px;
      }
      .additional-col {
        min-width: 240px;
      }
      .mobile-only {
        display: none;
      }
      .footer-status {
        margin-top: 16px;
      }
      .details-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .details-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .details-label {
        font-size: 12px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .details-value {
        white-space: pre-wrap;
      }
      details summary {
        cursor: pointer;
        font-weight: 600;
        color: #333;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 10;
      }
      .modal[hidden] {
        display: none;
      }
      .modal-content {
        background: #fff;
        border-radius: 8px;
        max-width: 900px;
        width: 100%;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid #eee;
      }
      .modal-body {
        padding: 16px;
        overflow: auto;
        white-space: pre-wrap;
      }
      .modal-close {
        border: none;
        background: none;
        font-size: 18px;
        cursor: pointer;
      }
      button {
        cursor: pointer;
      }
      @media (max-width: 900px) {
        body {
          margin: 16px;
        }
        th,
        td {
          padding: 6px;
          font-size: 13px;
        }
      }
      @media (max-width: 720px) {
        .hide-on-mobile {
          display: none;
        }
        .additional-col {
          display: none;
        }
        .mobile-only {
          display: table-cell;
        }
      }
    </style>
  </head>
  <body>
    <h1>GPT-Erdos</h1>
    <p class="small">
      <a href="https://github.com/neelsomani/gpt-erdos" target="_blank" rel="noreferrer">
        View repo
      </a>
    </p>
    <div class="controls">
      <div class="controls-row">
        <label class="nowrap">
          Problems YAML:
          <a
            class="small"
            href="https://github.com/teorth/erdosproblems/"
            target="_blank"
            rel="noreferrer"
          >
            Loaded from GitHub
          </a>
        </label>
        <label class="nowrap">
          Unsolved JSONL:
          <a
            class="small"
            href="https://www.ocf.berkeley.edu/~neel/unsolved.jsonl"
            target="_blank"
            rel="noreferrer"
          >
            Loaded from server
          </a>
        </label>
      </div>
      <div class="controls-row">
        <label class="nowrap">
          Solutions manifest:
          <input type="file" id="manifestInput" accept=".json" />
        </label>
        <label class="nowrap">
          Candidate solution:
          <input type="file" id="candidateInput" accept=".md,.markdown" />
        </label>
        <label class="nowrap">
          Candidate problem #:
          <input type="text" id="candidateNumber" inputmode="numeric" size="6" />
        </label>
      </div>
      <span class="status" id="status" hidden></span>
    </div>
    <div class="table-wrap">
      <table id="table" aria-live="polite">
        <thead>
          <tr>
            <th style="width: 120px;">Number</th>
            <th class="problem-col">Problem</th>
            <th class="additional-col">Additional</th>
            <th class="hide-on-mobile" style="width: 70px;">Prior solution found</th>
            <th class="hide-on-mobile" style="width: 160px;">Deep Research</th>
            <th class="hide-on-mobile" style="width: 80px;">Solution manually verified</th>
            <th class="hide-on-mobile" style="width: 160px;">5.2 Pro</th>
            <th class="hide-on-mobile" style="width: 140px;">Prompter</th>
            <th class="hide-on-mobile" style="width: 140px;">
              Aristotle formal proof file
            </th>
            <th class="mobile-only" style="width: 90px;">Details</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="modal" id="candidateModal" hidden>
      <div class="modal-content" role="dialog" aria-modal="true">
        <div class="modal-header">
          <strong id="candidateModalTitle"></strong>
          <button class="modal-close" type="button" id="candidateModalClose">✕</button>
        </div>
        <div class="modal-body" id="candidateModalBody"></div>
      </div>
    </div>
    <div class="modal" id="detailsModal" hidden>
      <div class="modal-content" role="dialog" aria-modal="true">
        <div class="modal-header">
          <strong id="detailsModalTitle"></strong>
          <button class="modal-close" type="button" id="detailsModalClose">✕</button>
        </div>
        <div class="modal-body" id="detailsModalBody"></div>
      </div>
    </div>
    <div class="toast-status" id="toastStatus" aria-live="polite"></div>
    <p class="small">
      The content on this website is dedicated to the public domain under CC0 1.0
      Universal. No rights reserved.
    </p>

    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
          displayMath: [
            ["$$", "$$"],
            ["\\[", "\\]"],
          ],
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
        },
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
      const problemsUrl =
        "https://raw.githubusercontent.com/teorth/erdosproblems/refs/heads/main/data/problems.yaml";
      const unsolvedUrl = "https://www.ocf.berkeley.edu/~neel/unsolved.jsonl";
      const manifestInput = document.getElementById("manifestInput");
      const candidateInput = document.getElementById("candidateInput");
      const candidateNumberInput = document.getElementById("candidateNumber");
      const statusEl = document.getElementById("status");
      const toastStatusEl = document.getElementById("toastStatus");
      const tbody = document.querySelector("#table tbody");
      const batchSize = 150;
      let mergedRecords = [];
      let renderedCount = 0;
      let isRendering = false;
      let hasRenderedOnce = false;
      let isScrollTriggered = false;
      let jsonlStatusText = "";
      let manifestStatusText = "";
      let candidateStatusText = "";

      function setStatus(message) {
        if (statusEl) {
          statusEl.textContent = message;
        }
      }

      function clearTable() {
        tbody.innerHTML = "";
        renderedCount = 0;
      }

      function shouldLoadNextBatch() {
        const doc = document.documentElement;
        const maxScroll = doc.scrollHeight - window.innerHeight;
        if (maxScroll <= 0) return true;
        return window.scrollY / maxScroll >= 0.75;
      }

      function shouldLoadNextBatch() {
        const doc = document.documentElement;
        const maxScroll = doc.scrollHeight - window.innerHeight;
        if (maxScroll <= 0) return true;
        return window.scrollY / maxScroll >= 0.75;
      }

      function updateStatus() {
        const baseStatus = `Showing ${renderedCount} of ${mergedRecords.length} problems.`;
        const loadingStatus = "";
        setStatus(
          `${baseStatus} ${jsonlStatusText} ${manifestStatusText} ${candidateStatusText}`,
        );
        if (toastStatusEl) {
          toastStatusEl.textContent = `${baseStatus.replace(/\.$/, "")}${loadingStatus}.`;
          toastStatusEl.classList.add("is-visible");
        }
      }

      function estimateRowHeight() {
        const firstRow = tbody.querySelector("tr");
        if (!firstRow) return 32;
        const height = firstRow.getBoundingClientRect().height;
        return height || 32;
      }

      function parseJsonl(text, limit) {
        const lines = text.split(/\r?\n/).filter((line) => line.trim() !== "");
        const records = [];
        for (const line of lines) {
          if (records.length >= limit) break;
          try {
            records.push(JSON.parse(line));
          } catch (error) {
            console.warn("Skipping invalid JSONL line", error);
          }
        }
        return { records, total: lines.length };
      }

      function normalizeNumber(value) {
        if (value === null || value === undefined) return "";
        return String(value).trim();
      }

      function parseManifestEntries(data) {
        if (!data || typeof data !== "object") return [];
        if (Array.isArray(data)) return data;
        if (Array.isArray(data.solutions)) return data.solutions;
        if (Array.isArray(data.entries)) return data.entries;
        if (Array.isArray(data.problems)) return data.problems;
        return Object.values(data).filter((value) => typeof value === "object");
      }

      function pickValue(entry, keys) {
        for (const key of keys) {
          if (entry[key] !== undefined && entry[key] !== null) {
            return entry[key];
          }
        }
        return "";
      }

      function normalizeString(value) {
        if (value === null || value === undefined) return "";
        if (typeof value === "string") return value.trim();
        return String(value).trim();
      }

      function parseTriState(value) {
        if (value === null || value === undefined || value === "") return "N/A";
        if (typeof value === "boolean") return value ? "✓" : "✗";
        if (typeof value === "number") return value ? "✓" : "✗";
        const normalized = String(value).trim().toLowerCase();
        if (!normalized) return "N/A";
        if (normalized.includes("true") || normalized === "yes") return "✓";
        if (normalized.includes("false") || normalized === "no") return "✗";
        return "N/A";
      }

      function buildSolutionsMap(entries) {
        const map = new Map();
        for (const entry of entries) {
          if (!entry || typeof entry !== "object") continue;
          const number = normalizeNumber(
            pickValue(entry, [
              "number",
              "problem_number",
              "problem",
              "id",
            ]),
          );
          if (!number) continue;
          map.set(number, {
            priorSolutionFound: normalizeString(
              pickValue(entry, [
                "prior_solution_found",
                "prior_solution",
                "deep_research_prior_solution",
                "deep_research_prior",
              ]),
            ),
            deepResearchResponse: normalizeString(
              pickValue(entry, [
                "deep_research_response",
                "deep_research_link",
                "deep_research_response_link",
                "deep_research_drive_link",
              ]),
            ),
            deepResearchPdfUrl: normalizeString(
              pickValue(entry, ["deep_research_pdf_url", "deep_research_pdf_link"]),
            ),
            deepResearchShareUrl: normalizeString(
              pickValue(entry, ["deep_research_share_url", "deep_research_chatgpt_link"]),
            ),
            solutionManuallyVerified: normalizeString(
              pickValue(entry, [
                "solution_manually_verified",
                "manual_verification",
                "pro_manual_verification",
                "pro_solution_verified",
              ]),
            ),
            proResponse: normalizeString(
              pickValue(entry, [
                "pro_response",
                "pro_response_link",
                "pro_link",
                "pro_drive_link",
                "pro_share_url",
              ]),
            ),
            solutionShareUrl: normalizeString(
              pickValue(entry, [
                "solution_share_url",
                "candidate_solution_share_url",
                "solution_markdown_share_url",
              ]),
            ),
            aristotleStatus: normalizeString(
              pickValue(entry, [
                "aristotle_status",
                "aristotle_result",
                "aristotle_formal_proof_status",
              ]),
            ),
            prompter: normalizeString(
              pickValue(entry, ["author", "prompter", "prompt_author"]),
            ),
          });
        }
        return map;
      }

      function appendLink(cell, url, label) {
        if (!url) {
          return;
        }
        const link = document.createElement("a");
        link.href = url;
        link.textContent = label || url;
        link.target = "_blank";
        link.rel = "noreferrer";
        cell.appendChild(link);
      }

      function appendLinkGroup(cell, links) {
        let hasLink = false;
        for (const linkItem of links) {
          if (!linkItem?.url) continue;
          if (hasLink) {
            cell.appendChild(document.createTextNode(" · "));
          }
          appendLink(cell, linkItem.url, linkItem.label);
          hasLink = true;
        }
        return hasLink;
      }

      function buildCandidateLink(number, text, onBeforeOpen) {
        if (!text || !number) return null;
        const link = document.createElement("button");
        link.type = "button";
        link.textContent = "View";
        link.addEventListener("click", () => {
          if (typeof onBeforeOpen === "function") {
            onBeforeOpen();
          }
          openCandidateModal(text, number);
        });
        return link;
      }

      function prepareMarkdownForMath(text) {
        const noMathBlocks = [];
        const noMathPattern = /\[\[nomath\]\]([\s\S]*?)\[\[\/nomath\]\]/gi;
        const protectNoMathBlocks = (value) =>
          value.replace(noMathPattern, (match, content) => {
            const index = noMathBlocks.length;
            noMathBlocks.push(content);
            return `@@NOMATH_${index}@@`;
          });
        const restoreNoMathBlocks = (value) =>
          value.replace(/@@NOMATH_(\d+)@@/g, (match, indexText) => {
            const index = Number(indexText);
            const content = noMathBlocks[index] ?? "";
            const segments = content.split(/(\$\$[\s\S]*?\$\$|\$[^$]*\$)/g);
            const rendered = segments
              .map((segment) => {
                if (!segment) return "";
                if (segment.startsWith("$$") || segment.startsWith("$")) {
                  return segment;
                }
                return segment
                  .replace(/\\/g, "\\\\")
                  .replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")
                  .replace(/\n/g, "<br>");
              })
              .join("");
            return `<span class="nomath">${rendered}</span>`;
          });
        const escapedDelimiters = protectNoMathBlocks(text)
          .replace(/(?<!\\)\\\[/g, "\\\\[")
          .replace(/(?<!\\)\\\]/g, "\\\\]")
          .replace(/(?<!\\)\\\(/g, "\\\\(")
          .replace(/(?<!\\)\\\)/g, "\\\\)");
        const preparedLines = escapedDelimiters
          .split("\n")
          .map((line) => {
            if (/^\s*\[$/.test(line)) return "\\\\[";
            if (/^\s*\]$/.test(line)) return "\\\\]";
            const trimmed = line.trim();
            if (trimmed.startsWith("[") && trimmed.endsWith("]")) {
              const inner = trimmed.slice(1, -1).trim();
              const looksMath =
                /\\[a-zA-Z]+/.test(inner) || /[=<>^_]/.test(inner) || /\|/.test(inner);
              if (inner && looksMath) {
                const leading = line.match(/^\s*/)?.[0] ?? "";
                return `${leading}\\\\[${inner}\\\\]`;
              }
            }
            return line;
          })
          .join("\n");
        const lines = preparedLines.split("\n");
        let inDisplayMath = false;
        const escapeHash = (value) => value.replace(/(^|[^\\])#/g, "$1\\\\#");
        const wrapParensInText = (segment) => {
          let result = "";
          let buffer = "";
          let depth = 0;
          let wrapEligible = true;
          for (let i = 0; i < segment.length; i += 1) {
            const char = segment[i];
            if (char === "(" && segment[i - 1] !== "\\") {
              if (depth === 0) {
                buffer = "";
                const before = segment.slice(0, i).trimEnd();
                wrapEligible = !/(\b(?:e\.g|i\.e))\.,?$/i.test(before);
              } else {
                buffer += char;
              }
              depth += 1;
              continue;
            }
            if (char === ")" && depth > 0 && segment[i - 1] !== "\\") {
              depth -= 1;
              if (depth === 0) {
                const inner = buffer.trim();
                const hasCommand = /\\[a-zA-Z]+/.test(inner);
                const hasOperator = /[=<>^_]/.test(inner) || /\|/.test(inner);
                const startsWithEg = /^(?:e\.g\.|i\.e\.)\b/i.test(inner);
                if (wrapEligible && !startsWithEg && inner && (hasCommand || hasOperator)) {
                  result += `\\\\(${escapeHash(buffer)}\\\\)`;
                } else {
                  result += `(${buffer})`;
                }
                buffer = "";
              } else {
                buffer += char;
              }
              continue;
            }
            if (depth > 0) {
              buffer += char;
            } else {
              result += char;
            }
          }
          if (depth > 0) {
            result += `(${buffer}`;
          }
          return result;
        };
        const wrapMathParensLine = (line) => {
          const segments = [];
          let buffer = "";
          let inCode = false;
          let i = 0;
          while (i < line.length) {
            const char = line[i];
            if (char === "`" && line[i - 1] !== "\\") {
              if (buffer) {
                segments.push({ type: "text", value: buffer });
                buffer = "";
              }
              inCode = !inCode;
              buffer += char;
              i += 1;
              continue;
            }
            if (!inCode && char === "$" && line[i - 1] !== "\\") {
              if (buffer) {
                segments.push({ type: "text", value: buffer });
                buffer = "";
              }
              const isDouble = line[i + 1] === "$";
              const delimiter = isDouble ? "$$" : "$";
              let j = i + delimiter.length;
              while (j < line.length) {
                if (
                  line[j] === "$" &&
                  line[j - 1] !== "\\" &&
                  (delimiter === "$" || line[j + 1] === "$")
                ) {
                  j += delimiter.length;
                  break;
                }
                j += 1;
              }
              const mathSegment = line.slice(i, j);
              if (mathSegment.length > delimiter.length) {
                segments.push({ type: "math", value: mathSegment });
              } else {
                segments.push({ type: "text", value: mathSegment });
              }
              i = j;
              continue;
            }
            buffer += char;
            i += 1;
          }
          if (buffer) {
            segments.push({ type: inCode ? "code" : "text", value: buffer });
          }
          return segments
            .map((segment) => {
              if (segment.type === "text") {
                return wrapParensInText(segment.value);
              }
              if (segment.type === "math") {
                const value = segment.value;
                const delimiter = value.startsWith("$$") ? "$$" : "$";
                const inner = value.slice(delimiter.length, -delimiter.length);
                return `${delimiter}${escapeHash(inner)}${delimiter}`;
              }
              return segment.value;
            })
            .join("");
        };
        const processed = lines.map((line) => {
          const trimmed = line.trim();
          if (trimmed === "\\\\[" || trimmed === "\\[") {
            inDisplayMath = true;
            return line;
          }
          if (trimmed === "\\\\]" || trimmed === "\\]") {
            inDisplayMath = false;
            return line;
          }
          if (
            trimmed.startsWith("\\\\[") &&
            trimmed.endsWith("\\\\]")
          ) {
            return escapeHash(line);
          }
          if (inDisplayMath) {
            return escapeHash(line);
          }
          return wrapMathParensLine(line);
        });
        return restoreNoMathBlocks(processed.join("\n"));
      }

      const candidateModal = document.getElementById("candidateModal");
      const candidateModalTitle = document.getElementById("candidateModalTitle");
      const candidateModalBody = document.getElementById("candidateModalBody");
      const candidateModalClose = document.getElementById("candidateModalClose");
      const detailsModal = document.getElementById("detailsModal");
      const detailsModalTitle = document.getElementById("detailsModalTitle");
      const detailsModalBody = document.getElementById("detailsModalBody");
      const detailsModalClose = document.getElementById("detailsModalClose");

      function openCandidateModal(text, number) {
        candidateModalTitle.textContent = `Candidate solution for problem ${number}`;
        if (window.marked) {
          const prepared = prepareMarkdownForMath(text);
          candidateModalBody.innerHTML = window.marked.parse(prepared);
        } else {
          candidateModalBody.textContent = text;
        }
        candidateModal.hidden = false;
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise([candidateModalBody]);
        }
      }

      function closeCandidateModal() {
        candidateModal.hidden = true;
        candidateModalTitle.textContent = "";
        candidateModalBody.textContent = "";
      }

      function buildDetailsItem(label, content) {
        const item = document.createElement("div");
        item.className = "details-item";
        const labelEl = document.createElement("div");
        labelEl.className = "details-label";
        labelEl.textContent = label;
        const valueEl = document.createElement("div");
        valueEl.className = "details-value";
        if (content instanceof Node) {
          valueEl.appendChild(content);
        } else {
          valueEl.textContent = content ?? "";
        }
        item.appendChild(labelEl);
        item.appendChild(valueEl);
        return item;
      }

      function renderMathContent(text) {
        const container = document.createElement("div");
        container.className = "latex-cell";
        if (!text) return container;
        container.textContent = text;
        return container;
      }

      function openDetailsModal(record) {
        const numberText = record.number ?? "";
        detailsModalTitle.textContent = numberText
          ? `Problem ${numberText} details`
          : "Problem details";
        detailsModalBody.textContent = "";
        const list = document.createElement("div");
        list.className = "details-list";
        list.appendChild(buildDetailsItem("State", record.state ?? ""));
        list.appendChild(
          buildDetailsItem("Problem", renderMathContent(record.latex ?? "")),
        );
        list.appendChild(
          buildDetailsItem(
            "Additional",
            renderMathContent(record.additional_text ?? ""),
          ),
        );
        list.appendChild(
          buildDetailsItem(
            "Prior solution found",
            parseTriState(record.prior_solution_found),
          ),
        );
        const researchLinks = document.createElement("div");
        appendLinkGroup(researchLinks, [
          { url: record.deep_research_pdf_url ?? "", label: "PDF Link" },
          { url: record.deep_research_share_url ?? "", label: "ChatGPT Link" },
        ]);
        list.appendChild(
          buildDetailsItem(
            "Deep Research",
            researchLinks.childNodes.length ? researchLinks : "",
          ),
        );
        list.appendChild(
          buildDetailsItem(
            "Solution manually verified",
            parseTriState(record.solution_manually_verified),
          ),
        );
        const proLinks = document.createElement("div");
        if (record.candidate_solution_text && numberText) {
          const candidateButton = buildCandidateLink(
            numberText,
            record.candidate_solution_text,
            closeDetailsModal,
          );
          if (candidateButton) {
            proLinks.appendChild(candidateButton);
            if (record.pro_response || record.solution_share_url) {
              proLinks.appendChild(document.createTextNode(" · "));
            }
          }
        }
        appendLinkGroup(proLinks, [
          { url: record.pro_response ?? "", label: "ChatGPT Link" },
          { url: record.solution_share_url ?? "", label: "ChatGPT Link" },
        ]);
        list.appendChild(
          buildDetailsItem("5.2 Pro", proLinks.childNodes.length ? proLinks : ""),
        );
        list.appendChild(buildDetailsItem("Prompter", record.prompter ?? ""));
        list.appendChild(
          buildDetailsItem(
            "Aristotle formal proof file",
            record.aristotle_status ?? "N/A",
          ),
        );
        detailsModalBody.appendChild(list);
        detailsModal.hidden = false;
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise([detailsModalBody]);
        }
      }

      function closeDetailsModal() {
        detailsModal.hidden = true;
        detailsModalTitle.textContent = "";
        detailsModalBody.textContent = "";
      }

      function renderRows(records, append = false) {
        if (!append) {
          clearTable();
        }
        for (const record of records) {
          const row = document.createElement("tr");

          const numberCell = document.createElement("td");
          const numberText = record.number ?? "";
          const stateText = record.state ?? "";
          if (numberText) {
            const numberLink = document.createElement("a");
            numberLink.textContent = numberText;
            numberLink.href = `https://www.erdosproblems.com/${numberText}`;
            numberLink.target = "_blank";
            numberLink.rel = "noreferrer";
            numberCell.appendChild(numberLink);
            if (stateText) {
              numberCell.appendChild(document.createTextNode(`: ${stateText}`));
            }
          } else {
            numberCell.textContent = stateText ? `: ${stateText}` : "";
          }
          row.appendChild(numberCell);

          const problemCell = document.createElement("td");
          problemCell.className = "latex-cell problem-col";
          problemCell.textContent = record.latex ?? "";
          row.appendChild(problemCell);

          const additionalCell = document.createElement("td");
          additionalCell.className = "additional-col";
          const additionalText = record.additional_text ?? "";
          if (additionalText) {
            const details = document.createElement("details");
            const summary = document.createElement("summary");
            summary.textContent = "Show";
            const additionalContent = document.createElement("div");
            additionalContent.className = "latex-cell";
            additionalContent.textContent = additionalText;
            details.appendChild(summary);
            details.appendChild(additionalContent);
            additionalCell.appendChild(details);
          } else {
            additionalCell.textContent = "";
          }
          row.appendChild(additionalCell);

          const priorSolutionCell = document.createElement("td");
          priorSolutionCell.className = "hide-on-mobile";
          priorSolutionCell.textContent = parseTriState(record.prior_solution_found);
          row.appendChild(priorSolutionCell);

          const deepResearchResponseCell = document.createElement("td");
          deepResearchResponseCell.className = "hide-on-mobile";
          appendLinkGroup(deepResearchResponseCell, [
            { url: record.deep_research_pdf_url ?? "", label: "PDF Link" },
            { url: record.deep_research_share_url ?? "", label: "ChatGPT Link" },
          ]);
          row.appendChild(deepResearchResponseCell);

          const manualVerifiedCell = document.createElement("td");
          manualVerifiedCell.className = "hide-on-mobile";
          manualVerifiedCell.textContent = parseTriState(
            record.solution_manually_verified,
          );
          row.appendChild(manualVerifiedCell);

          const proResponseCell = document.createElement("td");
          proResponseCell.className = "hide-on-mobile";
          const proLinks = [
            { url: record.pro_response ?? "", label: "ChatGPT Link" },
            { url: record.solution_share_url ?? "", label: "ChatGPT Link" },
          ];
          const hasProLinks = proLinks.some((link) => link.url);
          if (record.candidate_solution_text && numberText) {
            const viewButton = buildCandidateLink(
              numberText,
              record.candidate_solution_text,
            );
            if (viewButton) {
              proResponseCell.appendChild(viewButton);
              if (hasProLinks) {
                proResponseCell.appendChild(document.createTextNode(" · "));
              }
            }
          }
          appendLinkGroup(proResponseCell, proLinks);
          row.appendChild(proResponseCell);

          const prompterCell = document.createElement("td");
          prompterCell.className = "hide-on-mobile";
          prompterCell.textContent = record.prompter ?? "";
          row.appendChild(prompterCell);

          const aristotleCell = document.createElement("td");
          aristotleCell.className = "hide-on-mobile";
          const aristotleStatus = record.aristotle_status ?? "";
          aristotleCell.textContent = aristotleStatus || "N/A";
          row.appendChild(aristotleCell);

          const detailsCell = document.createElement("td");
          detailsCell.className = "mobile-only";
          const detailsButton = document.createElement("button");
          detailsButton.type = "button";
          detailsButton.textContent = "Details";
          detailsButton.addEventListener("click", () => {
            openDetailsModal(record);
          });
          detailsCell.appendChild(detailsButton);
          row.appendChild(detailsCell);

          tbody.appendChild(row);
        }
      }

      async function renderNextBatch({ triggeredByScroll = false } = {}) {
        if (isRendering) return;
        if (renderedCount >= mergedRecords.length) return;
        isRendering = true;
        isScrollTriggered = triggeredByScroll;
        const isInitialBatch = !hasRenderedOnce;
        const nextBatch = mergedRecords.slice(
          renderedCount,
          renderedCount + batchSize,
        );
        renderedCount += nextBatch.length;
        updateStatus();
        await new Promise((resolve) => requestAnimationFrame(resolve));
        renderRows(nextBatch, true);
        if (isInitialBatch) {
          hasRenderedOnce = true;
        }
        if (window.MathJax && window.MathJax.typesetPromise) {
          await window.MathJax.typesetPromise();
        }
        isScrollTriggered = false;
        updateStatus();
        isRendering = false;
      }

      function readFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error("Failed to read file."));
          reader.readAsText(file);
        });
      }

      async function render() {
        try {
          setStatus("");
          if (toastStatusEl) {
            toastStatusEl.textContent = "Loading problems...";
            toastStatusEl.classList.add("is-visible");
          }
          await new Promise((resolve) => requestAnimationFrame(resolve));
          const response = await fetch(problemsUrl);
          if (!response.ok) {
            setStatus("Failed to load problems.yaml.");
            return;
          }
          const yamlText = await response.text();
          const problems = window.jsyaml.load(yamlText);
          if (!Array.isArray(problems)) {
            setStatus("problems.yaml did not parse to a list.");
            return;
          }

          const unsolvedResponse = await fetch(unsolvedUrl);
          if (!unsolvedResponse.ok) {
            setStatus("Failed to load unsolved.jsonl from server.");
            return;
          }
          const jsonlText = await unsolvedResponse.text();
          const parsed = parseJsonl(jsonlText, Number.POSITIVE_INFINITY);
          const jsonlRecords = parsed.records;
          const jsonlTotal = parsed.total;

          const manifestFile = manifestInput.files[0];
          let manifestEntries = [];
          if (manifestFile) {
            const manifestText = await readFile(manifestFile);
            const manifestData = JSON.parse(manifestText);
            manifestEntries = parseManifestEntries(manifestData);
          }
          const solutionsMap = buildSolutionsMap(manifestEntries);

          const candidateFile = candidateInput.files[0];
          const candidateNumber = normalizeNumber(candidateNumberInput.value);
          let candidateText = "";
          if (candidateFile) {
            candidateText = await readFile(candidateFile);
          }
          if (candidateText && candidateNumber) {
            const existing = solutionsMap.get(candidateNumber) ?? {
              priorSolutionFound: "",
              deepResearchResponse: "",
              deepResearchPdfUrl: "",
              deepResearchShareUrl: "",
              solutionManuallyVerified: "",
              proResponse: "",
              solutionShareUrl: "",
              aristotleStatus: "",
            };
            solutionsMap.set(candidateNumber, { ...existing });
          }

          const unsolvedMap = new Map(
            jsonlRecords.map((record) => [String(record.number), record]),
          );

          const allowedStates = new Set(["open", "falsifiable", "verifiable"]);
          const merged = [];
          for (const problem of problems) {
            const number = String(problem.number ?? "");
            const state = problem.status?.state ?? "";
            if (!allowedStates.has(state)) {
              continue;
            }
            const match = unsolvedMap.get(number);
            const solution = solutionsMap.get(number);
            merged.push({
              number,
              state,
              latex: match?.latex ?? "",
              additional_text: match?.additional_text ?? "",
              prior_solution_found: solution?.priorSolutionFound ?? "",
              deep_research_response: solution?.deepResearchResponse ?? "",
              deep_research_pdf_url: solution?.deepResearchPdfUrl ?? "",
              deep_research_share_url: solution?.deepResearchShareUrl ?? "",
              solution_manually_verified: solution?.solutionManuallyVerified ?? "",
              pro_response: solution?.proResponse ?? "",
              solution_share_url: solution?.solutionShareUrl ?? "",
              prompter: solution?.prompter ?? "",
              aristotle_status: solution?.aristotleStatus ?? "",
              candidate_solution_text:
                candidateNumber === number ? candidateText : "",
            });
          }

          mergedRecords = merged;
          renderRows([]);
          const jsonlStatus = `Loaded from server (${jsonlRecords.length} of ${jsonlTotal} JSONL rows).`;
          const manifestStatus = manifestFile
            ? `Loaded ${manifestEntries.length} manifest entries.`
            : "No manifest file loaded.";
          const candidateStatus = candidateFile
            ? candidateNumber
              ? `Loaded candidate solution for problem ${candidateNumber}.`
              : "Candidate solution loaded (missing problem #)."
            : "No candidate solution loaded.";
          jsonlStatusText = jsonlStatus;
          manifestStatusText = manifestStatus;
          candidateStatusText = candidateStatus;
          updateStatus();
          await renderNextBatch();
        } catch (error) {
          console.error(error);
          setStatus("Failed to parse files.");
        }
      }

      manifestInput.addEventListener("change", () => {
        if (manifestInput.files.length) {
          render();
        }
      });
      candidateInput.addEventListener("change", () => {
        if (candidateInput.files.length) {
          render();
        }
      });
      candidateNumberInput.addEventListener("input", () => {
        if (candidateInput.files.length) {
          render();
        }
      });
      candidateModalClose.addEventListener("click", () => {
        closeCandidateModal();
      });
      detailsModalClose.addEventListener("click", () => {
        closeDetailsModal();
      });
      candidateModal.addEventListener("click", (event) => {
        if (event.target === candidateModal) {
          closeCandidateModal();
        }
      });
      detailsModal.addEventListener("click", (event) => {
        if (event.target === detailsModal) {
          closeDetailsModal();
        }
      });
      window.addEventListener("scroll", () => {
        if (shouldLoadNextBatch()) {
          renderNextBatch({ triggeredByScroll: true });
        }
      });
      window.addEventListener("resize", () => {
        if (shouldLoadNextBatch()) {
          renderNextBatch({ triggeredByScroll: true });
        }
      });
      window.addEventListener("DOMContentLoaded", () => {
        render();
      });
    </script>
  </body>
</html>

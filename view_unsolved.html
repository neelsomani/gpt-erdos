<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPT-Erdos</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 24px;
        color: #111;
      }
      h1 {
        margin-bottom: 8px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin: 16px 0 24px;
      }
      .status {
        color: #555;
        font-size: 14px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      thead {
        position: sticky;
        top: 0;
        background: #f5f5f5;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        vertical-align: top;
        word-wrap: break-word;
      }
      th {
        text-align: left;
      }
      tbody tr:nth-child(even) {
        background: #fafafa;
      }
      .nowrap {
        white-space: nowrap;
      }
      .small {
        font-size: 12px;
        color: #666;
      }
      .textarea-cell {
        white-space: pre-line;
      }
      .latex-cell {
        white-space: pre-line;
      }
      details summary {
        cursor: pointer;
        font-weight: 600;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1>GPT-Erdos</h1>
    <p class="small">
      <a href="https://github.com/neelsomani/gpt-erdos" target="_blank" rel="noreferrer">
        View repo
      </a>
    </p>
    <div class="controls">
      <label class="nowrap">
        Problems YAML:
        <a
          class="small"
          href="https://github.com/teorth/erdosproblems/"
          target="_blank"
          rel="noreferrer"
        >
          Loaded from GitHub
        </a>
      </label>
      <label class="nowrap">
        Unsolved JSONL:
        <input type="file" id="fileInput" accept=".jsonl" />
      </label>
      <span class="status" id="status"></span>
    </div>
    <table id="table" aria-live="polite">
      <thead>
        <tr>
          <th style="width: 80px;">Number</th>
          <th style="width: 100px;">State</th>
          <th>Problem</th>
          <th>Additional</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p class="small">
      The content on this website is dedicated to the public domain under CC0 1.0
      Universal. No rights reserved.
    </p>

    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
          displayMath: [
            ["$$", "$$"],
            ["\\[", "\\]"],
          ],
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
        },
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>

    <script>
      const problemsUrl =
        "https://raw.githubusercontent.com/teorth/erdosproblems/refs/heads/main/data/problems.yaml";
      const fileInput = document.getElementById("fileInput");
      const statusEl = document.getElementById("status");
      const tbody = document.querySelector("#table tbody");

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function clearTable() {
        tbody.innerHTML = "";
      }

      function parseJsonl(text, limit) {
        const lines = text.split(/\r?\n/).filter((line) => line.trim() !== "");
        const records = [];
        for (const line of lines) {
          if (records.length >= limit) break;
          try {
            records.push(JSON.parse(line));
          } catch (error) {
            console.warn("Skipping invalid JSONL line", error);
          }
        }
        return { records, total: lines.length };
      }

      function renderRows(records) {
        clearTable();
        for (const record of records) {
          const row = document.createElement("tr");

          const numberCell = document.createElement("td");
          numberCell.textContent = record.number ?? "";
          row.appendChild(numberCell);

          const stateCell = document.createElement("td");
          stateCell.textContent = record.state ?? "";
          row.appendChild(stateCell);

          const problemCell = document.createElement("td");
          problemCell.className = "latex-cell";
          problemCell.textContent = record.latex ?? "";
          row.appendChild(problemCell);

          const additionalCell = document.createElement("td");
          const additionalText = record.additional_text ?? "";
          if (additionalText) {
            const details = document.createElement("details");
            const summary = document.createElement("summary");
            summary.textContent = "Show";
            const additionalContent = document.createElement("div");
            additionalContent.className = "latex-cell";
            additionalContent.textContent = additionalText;
            details.appendChild(summary);
            details.appendChild(additionalContent);
            additionalCell.appendChild(details);
          } else {
            additionalCell.textContent = "";
          }
          row.appendChild(additionalCell);

          tbody.appendChild(row);
        }
      }

      function readFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error("Failed to read file."));
          reader.readAsText(file);
        });
      }

      async function render() {
        try {
          const response = await fetch(problemsUrl);
          if (!response.ok) {
            setStatus("Failed to load problems.yaml.");
            return;
          }
          const yamlText = await response.text();
          const problems = window.jsyaml.load(yamlText);
          if (!Array.isArray(problems)) {
            setStatus("problems.yaml did not parse to a list.");
            return;
          }

          const jsonlFile = fileInput.files[0];
          let jsonlRecords = [];
          let jsonlTotal = 0;
          if (jsonlFile) {
            const jsonlText = await readFile(jsonlFile);
            const parsed = parseJsonl(jsonlText, Number.POSITIVE_INFINITY);
            jsonlRecords = parsed.records;
            jsonlTotal = parsed.total;
          }

          const unsolvedMap = new Map(
            jsonlRecords.map((record) => [String(record.number), record]),
          );

          const allowedStates = new Set(["open", "falsifiable", "verifiable"]);
          const merged = [];
          for (const problem of problems) {
            const number = String(problem.number ?? "");
            const state = problem.status?.state ?? "";
            if (!allowedStates.has(state)) {
              continue;
            }
            const match = unsolvedMap.get(number);
            merged.push({
              number,
              state,
              latex: match?.latex ?? "",
              additional_text: match?.additional_text ?? "",
            });
          }

          renderRows(merged);
          if (window.MathJax && window.MathJax.typesetPromise) {
            await window.MathJax.typesetPromise();
          }
          const baseStatus = `Showing ${merged.length} of ${problems.length} problems.`;
          const jsonlStatus = jsonlFile
            ? `Loaded ${jsonlRecords.length} of ${jsonlTotal} JSONL rows.`
            : "No JSONL file loaded.";
          setStatus(`${baseStatus} ${jsonlStatus}`);
        } catch (error) {
          console.error(error);
          setStatus("Failed to parse files.");
        }
      }

      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) {
          render();
        }
      });
    </script>
  </body>
</html>

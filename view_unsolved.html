<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPT-Erdos</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 24px;
        color: #111;
      }
      h1 {
        margin-bottom: 8px;
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin: 16px 0 24px;
      }
      .controls-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .branch-form {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 0;
      }
      .branch-input {
        padding: 4px 6px;
      }
      .branch-button {
        padding: 4px 10px;
      }
      .status {
        color: #555;
        font-size: 14px;
      }
      .toast-status {
        position: fixed;
        right: 16px;
        bottom: 16px;
        background: rgba(17, 17, 17, 0.72);
        color: #fff;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        z-index: 20;
        pointer-events: none;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 150ms ease, transform 150ms ease;
      }
      .toast-status.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: auto;
      }
      .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      thead {
        position: sticky;
        top: 0;
        background: #f5f5f5;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        vertical-align: top;
        word-wrap: break-word;
      }
      th {
        text-align: left;
      }
      th select,
      th input {
        margin-top: 4px;
        width: 100%;
        box-sizing: border-box;
        font-size: 12px;
      }
      tbody tr:nth-child(even) {
        background: #fafafa;
      }
      .nowrap {
        white-space: nowrap;
      }
      .small {
        font-size: 12px;
        color: #666;
      }
      .textarea-cell {
        white-space: pre-line;
      }
      .latex-cell {
        white-space: pre-line;
      }
      .problem-col {
        min-width: 240px;
      }
      .copy-latex-button {
        margin-top: 6px;
        padding: 4px 8px;
        font-size: 12px;
      }
      .additional-col {
        min-width: 240px;
      }
      .mobile-only {
        display: none;
      }
      .footer-status {
        margin-top: 16px;
      }
      .details-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .details-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .details-label {
        font-size: 12px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .details-value {
        white-space: pre-wrap;
      }
      details summary {
        cursor: pointer;
        font-weight: 600;
        color: #333;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 10;
      }
      .modal[hidden] {
        display: none;
      }
      .modal-content {
        background: #fff;
        border-radius: 8px;
        max-width: 900px;
        width: 100%;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid #eee;
        gap: 12px;
      }
      .modal-header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .modal-body {
        padding: 16px;
        overflow: auto;
        white-space: pre-wrap;
      }
      .modal-body pre {
        margin: 0;
        font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        font-size: 13px;
        line-height: 1.4;
      }
      .modal-close {
        border: none;
        background: none;
        font-size: 18px;
        cursor: pointer;
      }
      button {
        cursor: pointer;
      }
      @media (max-width: 900px) {
        body {
          margin: 16px;
        }
        th,
        td {
          padding: 6px;
          font-size: 13px;
        }
      }
      @media (max-width: 720px) {
        .hide-on-mobile {
          display: none;
        }
        .additional-col {
          display: none;
        }
        .mobile-only {
          display: table-cell;
        }
      }
    </style>
  </head>
  <body>
    <h1>GPT-Erdos</h1>
    <p class="small">
      <a href="https://github.com/neelsomani/gpt-erdos" target="_blank" rel="noreferrer">
        View repo
      </a>
    </p>
    <div class="controls">
      <div class="controls-row">
        <form class="branch-form" id="branchForm">
          <label class="nowrap" for="branchInput">Branch:</label>
          <input class="branch-input" id="branchInput" type="text" value="main" />
          <button class="branch-button" type="submit">Submit</button>
        </form>
        <label class="nowrap">
          <input type="checkbox" id="manifestFilter" />
          Show only missing from manifest
        </label>
      </div>
      <div class="controls-row">
        <label class="nowrap">
          Problems YAML:
          <a
            class="small"
            href="https://github.com/teorth/erdosproblems/"
            target="_blank"
            rel="noreferrer"
          >
            Loaded from GitHub
          </a>
        </label>
        <label class="nowrap">
          Unsolved JSONL:
          <a
            class="small"
            href="https://www.ocf.berkeley.edu/~neel/unsolved.jsonl"
            target="_blank"
            rel="noreferrer"
          >
            Loaded from server
          </a>
        </label>
      </div>
      <div class="controls-row">
        <label class="nowrap">
          Solutions manifest:
          <a
            class="small"
            href="https://github.com/neelsomani/gpt-erdos"
            target="_blank"
            rel="noreferrer"
          >
            Loaded from GitHub
          </a>
        </label>
        <label class="nowrap">
          Candidate solutions:
          <a
            class="small"
            href="https://github.com/neelsomani/gpt-erdos"
            target="_blank"
            rel="noreferrer"
          >
            Loaded from GitHub
          </a>
        </label>
      </div>
      <span class="status" id="status" hidden></span>
    </div>
    <div class="table-wrap">
      <table id="table" aria-live="polite">
        <thead>
          <tr>
            <th style="width: 120px;">Number</th>
            <th class="problem-col">Problem</th>
            <th class="additional-col">Additional</th>
            <th class="hide-on-mobile" style="width: 70px;">
              <div>Prior solution found</div>
              <select id="filterPriorSolution" aria-label="Filter prior solution found">
                <option value="">All</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </th>
            <th class="hide-on-mobile" style="width: 160px;">Deep Research</th>
            <th class="hide-on-mobile" style="width: 80px;">
              <div>Reviewer agrees with proof</div>
              <select
                id="filterManualReview"
                aria-label="Filter reviewer agrees with proof"
              >
                <option value="">All</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
                <option value="na">N/A</option>
              </select>
            </th>
            <th class="hide-on-mobile" style="width: 160px;">5.2 Pro</th>
            <th class="hide-on-mobile" style="width: 140px;">
              <div>Prompter</div>
              <input
                id="filterPrompter"
                type="text"
                placeholder="Name"
                aria-label="Filter prompter"
              />
            </th>
            <th class="hide-on-mobile" style="width: 140px;">
              Aristotle formal proof file
              <select
                id="filterAristotle"
                aria-label="Filter Aristotle formal proof file"
              >
                <option value="">All</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </th>
            <th class="mobile-only" style="width: 90px;">Details</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="modal" id="candidateModal" hidden>
      <div class="modal-content" role="dialog" aria-modal="true">
        <div class="modal-header">
          <strong id="candidateModalTitle"></strong>
          <div class="modal-header-actions">
            <button type="button" id="candidateModalCopy" hidden>Copy</button>
            <button class="modal-close" type="button" id="candidateModalClose">✕</button>
          </div>
        </div>
        <div class="modal-body" id="candidateModalBody"></div>
      </div>
    </div>
    <div class="modal" id="detailsModal" hidden>
      <div class="modal-content" role="dialog" aria-modal="true">
        <div class="modal-header">
          <strong id="detailsModalTitle"></strong>
          <button class="modal-close" type="button" id="detailsModalClose">✕</button>
        </div>
        <div class="modal-body" id="detailsModalBody"></div>
      </div>
    </div>
    <div class="toast-status" id="toastStatus" aria-live="polite"></div>
    <p class="small">
      The content on this website is dedicated to the public domain under CC0 1.0
      Universal. No rights reserved.
    </p>

    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
          displayMath: [
            ["$$", "$$"],
            ["\\[", "\\]"],
          ],
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
        },
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
      const problemsUrl =
        "https://raw.githubusercontent.com/teorth/erdosproblems/refs/heads/main/data/problems.yaml";
      const unsolvedUrl = "https://www.ocf.berkeley.edu/~neel/unsolved.jsonl";
      const githubToken = "REDACTED";
      const githubOwner = "neelsomani";
      const githubRepo = "gpt-erdos";
      let githubRef = "main";
      const manifestPath = "data/solutions/manifest.json";
      const solutionsBasePath = "data/solutions";
      const statusEl = document.getElementById("status");
      const toastStatusEl = document.getElementById("toastStatus");
      const tbody = document.querySelector("#table tbody");
      const branchForm = document.getElementById("branchForm");
      const branchInput = document.getElementById("branchInput");
      const manifestFilter = document.getElementById("manifestFilter");
      const filterPriorSolution = document.getElementById("filterPriorSolution");
      const filterManualReview = document.getElementById("filterManualReview");
      const filterPrompter = document.getElementById("filterPrompter");
      const filterAristotle = document.getElementById("filterAristotle");
      const batchSize = 150;
      let allRecords = [];
      let mergedRecords = [];
      let renderedCount = 0;
      let isRendering = false;
      let hasRenderedOnce = false;
      let isScrollTriggered = false;
      let isLoading = false;
      let pendingRender = false;
      let jsonlStatusText = "";
      let manifestStatusText = "";
      let candidateStatusText = "";
      const candidateCache = new Map();
      let toastTimeoutId = null;

      function setStatus(message) {
        if (statusEl) {
          statusEl.textContent = message;
        }
      }

      function flashToast(message) {
        if (!toastStatusEl) return;
        toastStatusEl.textContent = message;
        toastStatusEl.classList.add("is-visible");
        if (toastTimeoutId) {
          clearTimeout(toastTimeoutId);
        }
        toastTimeoutId = setTimeout(() => {
          updateStatus();
        }, 1600);
      }

      async function copyTextToClipboard(text) {
        if (!text) return false;
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        const success = document.execCommand("copy");
        document.body.removeChild(textarea);
        return success;
      }

      function buildGithubHeaders() {
        if (!githubToken) return null;
        return {
          Authorization: `Bearer ${githubToken}`,
          Accept: "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
        };
      }

      async function fetchGithubJson(path) {
        const url = `https://api.github.com/repos/${githubOwner}/${githubRepo}/contents/${path}?ref=${githubRef}`;
        const response = await fetch(url, {
          headers: buildGithubHeaders() ?? undefined,
        });
        if (!response.ok) {
          throw new Error(`${response.status}: ${await response.text()}`);
        }
        return response.json();
      }

      async function fetchGithubText(path) {
        const payload = await fetchGithubJson(path);
        if (!payload?.content) {
          throw new Error("GitHub API response missing content.");
        }
        const b64 = String(payload.content).replace(/\n/g, "");
        const bytes = Uint8Array.from(atob(b64), (char) => char.charCodeAt(0));
        return new TextDecoder("utf-8").decode(bytes);
      }

      function clearTable() {
        tbody.innerHTML = "";
        renderedCount = 0;
      }

      function resetRenderState() {
        allRecords = [];
        mergedRecords = [];
        renderedCount = 0;
        isRendering = false;
        hasRenderedOnce = false;
        isScrollTriggered = false;
        clearTable();
      }

      function resetRenderStatePreservingRecords() {
        renderedCount = 0;
        isRendering = false;
        hasRenderedOnce = false;
        isScrollTriggered = false;
        clearTable();
      }

      function shouldLoadNextBatch() {
        const doc = document.documentElement;
        const maxScroll = doc.scrollHeight - window.innerHeight;
        if (maxScroll <= 0) return true;
        return window.scrollY / maxScroll >= 0.75;
      }

      function updateStatus() {
        const baseStatus = `Showing ${renderedCount} of ${mergedRecords.length} problems.`;
        const filterStatus = manifestFilter?.checked
          ? "Showing only problems missing from manifest."
          : "";
        const loadingStatus = "";
        setStatus(
          `${baseStatus} ${filterStatus} ${jsonlStatusText} ${manifestStatusText} ${candidateStatusText}`,
        );
        if (toastStatusEl) {
          toastStatusEl.textContent = `${baseStatus.replace(/\.$/, "")}${loadingStatus}.`;
          toastStatusEl.classList.add("is-visible");
        }
      }

      function estimateRowHeight() {
        const firstRow = tbody.querySelector("tr");
        if (!firstRow) return 32;
        const height = firstRow.getBoundingClientRect().height;
        return height || 32;
      }

      function parseJsonl(text, limit) {
        const lines = text.split(/\r?\n/).filter((line) => line.trim() !== "");
        const records = [];
        for (const line of lines) {
          if (records.length >= limit) break;
          try {
            records.push(JSON.parse(line));
          } catch (error) {
            console.warn("Skipping invalid JSONL line", error);
          }
        }
        return { records, total: lines.length };
      }

      function normalizeNumber(value) {
        if (value === null || value === undefined) return "";
        return String(value).trim();
      }

      function parseManifestEntries(data) {
        if (!data || typeof data !== "object") return [];
        if (Array.isArray(data)) return data;
        if (Array.isArray(data.solutions)) return data.solutions;
        if (Array.isArray(data.entries)) return data.entries;
        if (Array.isArray(data.problems)) return data.problems;
        return Object.values(data).filter((value) => typeof value === "object");
      }

      function pickValue(entry, keys) {
        for (const key of keys) {
          if (entry[key] !== undefined && entry[key] !== null) {
            return entry[key];
          }
        }
        return "";
      }

      function normalizeString(value) {
        if (value === null || value === undefined) return "";
        if (typeof value === "string") return value.trim();
        return String(value).trim();
      }

      function parseTriState(value) {
        if (value === null || value === undefined || value === "") return "N/A";
        if (typeof value === "boolean") return value ? "✓" : "✗";
        if (typeof value === "number") return value ? "✓" : "✗";
        const normalized = String(value).trim().toLowerCase();
        if (!normalized) return "N/A";
        if (normalized.includes("true") || normalized === "yes") return "✓";
        if (normalized.includes("false") || normalized === "no") return "✗";
        return "N/A";
      }

      function normalizeBoolean(value) {
        if (value === null || value === undefined || value === "") return false;
        if (typeof value === "boolean") return value;
        if (typeof value === "number") return value !== 0;
        const normalized = String(value).trim().toLowerCase();
        return (
          normalized === "true" ||
          normalized === "yes" ||
          normalized === "1"
        );
      }

      function buildSolutionsMap(entries) {
        const map = new Map();
        for (const entry of entries) {
          if (!entry || typeof entry !== "object") continue;
          const number = normalizeNumber(
            pickValue(entry, [
              "number",
              "problem_number",
              "problem",
              "id",
            ]),
          );
          if (!number) continue;
          const solutionFormallyVerified = normalizeBoolean(
            pickValue(entry, [
              "solution_formally_verified",
              "formal_verification",
              "aristotle_formal_proof",
            ]),
          );
          map.set(number, {
            priorSolutionFound: normalizeString(
              pickValue(entry, [
                "prior_solution_found",
                "prior_solution",
                "deep_research_prior_solution",
                "deep_research_prior",
              ]),
            ),
            deepResearchResponse: normalizeString(
              pickValue(entry, [
                "deep_research_response",
                "deep_research_link",
                "deep_research_response_link",
                "deep_research_drive_link",
              ]),
            ),
            deepResearchPdfUrl: normalizeString(
              pickValue(entry, ["deep_research_pdf_url", "deep_research_pdf_link"]),
            ),
            deepResearchShareUrl: normalizeString(
              pickValue(entry, ["deep_research_share_url", "deep_research_chatgpt_link"]),
            ),
            solutionManuallyVerified: normalizeString(
              pickValue(entry, [
                "solution_manually_verified",
                "manual_verification",
                "pro_manual_verification",
                "pro_solution_verified",
              ]),
            ),
            solutionManualReviewReason: normalizeString(
              pickValue(entry, [
                "solution_manual_review_reason",
                "solution_manually_verified_reason",
                "manual_review_reason",
                "review_reason",
              ]),
            ),
            solutionManualReviewer: normalizeString(
              pickValue(entry, [
                "solution_manual_reviewer",
                "solution_manually_verified_by",
                "manual_reviewer",
                "reviewer",
              ]),
            ),
            proResponse: normalizeString(
              pickValue(entry, [
                "pro_response",
                "pro_response_link",
                "pro_link",
                "pro_drive_link",
                "pro_share_url",
              ]),
            ),
            solutionShareUrl: normalizeString(
              pickValue(entry, [
                "solution_share_url",
                "candidate_solution_share_url",
                "solution_markdown_share_url",
              ]),
            ),
            aristotleStatus: normalizeString(
              pickValue(entry, [
                "aristotle_status",
                "aristotle_result",
                "aristotle_formal_proof_status",
              ]),
            ),
            prompter: normalizeString(
              pickValue(entry, ["author", "prompter", "prompt_author"]),
            ),
            candidateSolutionUrl: `${solutionsBasePath}/${number}/candidate_solution.md`,
            aristotleProofUrl: solutionFormallyVerified
              ? `${solutionsBasePath}/${number}/candidate_solution.lean`
              : "",
          });
        }
        return map;
      }

      function matchesTriStateFilter(value, filterValue) {
        if (!filterValue) return true;
        const normalized = parseTriState(value);
        if (filterValue === "yes") return normalized === "✓";
        if (filterValue === "no") return normalized === "✗";
        if (filterValue === "na") return normalized === "N/A";
        return true;
      }

      function matchesPrompterFilter(value, filterValue) {
        if (!filterValue) return true;
        const query = filterValue.trim().toLowerCase();
        if (!query) return true;
        return normalizeString(value).toLowerCase().includes(query);
      }

      function matchesAristotleFilter(proofUrl, filterValue) {
        if (!filterValue) return true;
        const hasProof = Boolean(proofUrl);
        if (filterValue === "yes") return hasProof;
        if (filterValue === "no") return !hasProof;
        return true;
      }

      function applyFilters(records) {
        let filtered = records;
        if (manifestFilter?.checked) {
          filtered = filtered.filter((record) => !record.in_manifest);
        }
        if (filterPriorSolution?.value) {
          filtered = filtered.filter((record) =>
            matchesTriStateFilter(
              record.prior_solution_found,
              filterPriorSolution.value,
            ),
          );
        }
        if (filterManualReview?.value) {
          filtered = filtered.filter((record) =>
            matchesTriStateFilter(
              record.solution_manually_verified,
              filterManualReview.value,
            ),
          );
        }
        if (filterPrompter?.value) {
          filtered = filtered.filter((record) =>
            matchesPrompterFilter(record.prompter, filterPrompter.value),
          );
        }
        if (filterAristotle?.value) {
          filtered = filtered.filter((record) =>
            matchesAristotleFilter(
              record.aristotle_proof_url,
              filterAristotle.value,
            ),
          );
        }
        return filtered;
      }

      function appendLink(cell, url, label) {
        if (!url) {
          return;
        }
        const link = document.createElement("a");
        link.href = url;
        link.textContent = label || url;
        link.target = "_blank";
        link.rel = "noreferrer";
        cell.appendChild(link);
      }

      function appendLinkGroup(cell, links) {
        let hasLink = false;
        for (const linkItem of links) {
          if (!linkItem?.url) continue;
          if (hasLink) {
            cell.appendChild(document.createTextNode(" · "));
          }
          appendLink(cell, linkItem.url, linkItem.label);
          hasLink = true;
        }
        return hasLink;
      }

      function buildCandidateLink(number, url, onBeforeOpen) {
        if (!url || !number) return null;
        const link = document.createElement("button");
        link.type = "button";
        link.textContent = "View";
        link.addEventListener("click", async () => {
          if (typeof onBeforeOpen === "function") {
            onBeforeOpen();
          }
          await openCandidateModalFromUrl(
            number,
            url,
            `Candidate solution for problem ${number}`,
          );
        });
        return link;
      }

      function buildAristotleLink(number, url, onBeforeOpen) {
        if (!url || !number) return null;
        const link = document.createElement("button");
        link.type = "button";
        link.textContent = "View";
        link.addEventListener("click", async () => {
          if (typeof onBeforeOpen === "function") {
            onBeforeOpen();
          }
          await openFileModalFromUrl(
            number,
            url,
            `Aristotle formal proof for problem ${number}`,
            "Aristotle formal proof",
          );
        });
        return link;
      }

      function prepareMarkdownForMath(text) {
        const noMathBlocks = [];
        const noMathPattern = /\[\[nomath\]\]([\s\S]*?)\[\[\/nomath\]\]/gi;
        const protectNoMathBlocks = (value) =>
          value.replace(noMathPattern, (match, content) => {
            const index = noMathBlocks.length;
            noMathBlocks.push(content);
            return `@@NOMATH_${index}@@`;
          });
        const restoreNoMathBlocks = (value) =>
          value.replace(/@@NOMATH_(\d+)@@/g, (match, indexText) => {
            const index = Number(indexText);
            const content = noMathBlocks[index] ?? "";
            const segments = content.split(/(\$\$[\s\S]*?\$\$|\$[^$]*\$)/g);
            const rendered = segments
              .map((segment) => {
                if (!segment) return "";
                if (segment.startsWith("$$") || segment.startsWith("$")) {
                  return segment;
                }
                return segment
                  .replace(/\\/g, "\\\\")
                  .replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")
                  .replace(/\n/g, "<br>");
              })
              .join("");
            return `<span class="nomath">${rendered}</span>`;
          });
        const escapedDelimiters = protectNoMathBlocks(text)
          .replace(/(?<!\\)\\\[/g, "\\\\[")
          .replace(/(?<!\\)\\\]/g, "\\\\]")
          .replace(/(?<!\\)\\\(/g, "\\\\(")
          .replace(/(?<!\\)\\\)/g, "\\\\)");
        const preparedLines = escapedDelimiters
          .split("\n")
          .map((line) => {
            if (/^\s*\[$/.test(line)) return "\\\\[";
            if (/^\s*\]$/.test(line)) return "\\\\]";
            const trimmed = line.trim();
            if (trimmed.startsWith("[") && trimmed.endsWith("]")) {
              const inner = trimmed.slice(1, -1).trim();
              const looksMath =
                /\\[a-zA-Z]+/.test(inner) || /[=<>^_]/.test(inner) || /\|/.test(inner);
              if (inner && looksMath) {
                const leading = line.match(/^\s*/)?.[0] ?? "";
                return `${leading}\\\\[${inner}\\\\]`;
              }
            }
            return line;
          })
          .join("\n");
        const lines = preparedLines.split("\n");
        let inDisplayMath = false;
        const escapeHash = (value) => value.replace(/(^|[^\\])#/g, "$1\\\\#");
        const wrapParensInText = (segment) => {
          let result = "";
          let buffer = "";
          let depth = 0;
          let wrapEligible = true;
          for (let i = 0; i < segment.length; i += 1) {
            const char = segment[i];
            if (char === "(" && segment[i - 1] !== "\\") {
              if (depth === 0) {
                buffer = "";
                const before = segment.slice(0, i).trimEnd();
                wrapEligible = !/(\b(?:e\.g|i\.e))\.,?$/i.test(before);
              } else {
                buffer += char;
              }
              depth += 1;
              continue;
            }
            if (char === ")" && depth > 0 && segment[i - 1] !== "\\") {
              depth -= 1;
              if (depth === 0) {
                const inner = buffer.trim();
                const hasCommand = /\\[a-zA-Z]+/.test(inner);
                const hasOperator = /[=<>^_]/.test(inner) || /\|/.test(inner);
                const startsWithEg = /^(?:e\.g\.|i\.e\.)\b/i.test(inner);
                if (wrapEligible && !startsWithEg && inner && (hasCommand || hasOperator)) {
                  result += `\\\\(${escapeHash(buffer)}\\\\)`;
                } else {
                  result += `(${buffer})`;
                }
                buffer = "";
              } else {
                buffer += char;
              }
              continue;
            }
            if (depth > 0) {
              buffer += char;
            } else {
              result += char;
            }
          }
          if (depth > 0) {
            result += `(${buffer}`;
          }
          return result;
        };
        const wrapMathParensLine = (line) => {
          const segments = [];
          let buffer = "";
          let inCode = false;
          let i = 0;
          while (i < line.length) {
            const char = line[i];
            if (char === "`" && line[i - 1] !== "\\") {
              if (buffer) {
                segments.push({ type: "text", value: buffer });
                buffer = "";
              }
              inCode = !inCode;
              buffer += char;
              i += 1;
              continue;
            }
            if (!inCode && char === "$" && line[i - 1] !== "\\") {
              if (buffer) {
                segments.push({ type: "text", value: buffer });
                buffer = "";
              }
              const isDouble = line[i + 1] === "$";
              const delimiter = isDouble ? "$$" : "$";
              let j = i + delimiter.length;
              while (j < line.length) {
                if (
                  line[j] === "$" &&
                  line[j - 1] !== "\\" &&
                  (delimiter === "$" || line[j + 1] === "$")
                ) {
                  j += delimiter.length;
                  break;
                }
                j += 1;
              }
              const mathSegment = line.slice(i, j);
              if (mathSegment.length > delimiter.length) {
                segments.push({ type: "math", value: mathSegment });
              } else {
                segments.push({ type: "text", value: mathSegment });
              }
              i = j;
              continue;
            }
            buffer += char;
            i += 1;
          }
          if (buffer) {
            segments.push({ type: inCode ? "code" : "text", value: buffer });
          }
          return segments
            .map((segment) => {
              if (segment.type === "text") {
                return wrapParensInText(segment.value);
              }
              if (segment.type === "math") {
                const value = segment.value;
                const delimiter = value.startsWith("$$") ? "$$" : "$";
                const inner = value.slice(delimiter.length, -delimiter.length);
                return `${delimiter}${escapeHash(inner)}${delimiter}`;
              }
              return segment.value;
            })
            .join("");
        };
        const processed = lines.map((line) => {
          const trimmed = line.trim();
          if (trimmed === "\\\\[" || trimmed === "\\[") {
            inDisplayMath = true;
            return line;
          }
          if (trimmed === "\\\\]" || trimmed === "\\]") {
            inDisplayMath = false;
            return line;
          }
          if (
            trimmed.startsWith("\\\\[") &&
            trimmed.endsWith("\\\\]")
          ) {
            return escapeHash(line);
          }
          if (inDisplayMath) {
            return escapeHash(line);
          }
          return wrapMathParensLine(line);
        });
        return restoreNoMathBlocks(processed.join("\n"));
      }

      function resetModalScroll(bodyEl, contentEl) {
        if (bodyEl) {
          bodyEl.scrollTop = 0;
          bodyEl.scrollLeft = 0;
        }
        if (contentEl) {
          contentEl.scrollTop = 0;
          contentEl.scrollLeft = 0;
        }
      }

      function openCandidateModal(text, title, options = {}) {
        candidateModalTitle.textContent = title;
        candidateModalBody.textContent = "";
        const { renderAsCode = false } = options;
        if (candidateModalCopy) {
          candidateModalCopy.hidden = !renderAsCode;
        }
        if (renderAsCode) {
          const pre = document.createElement("pre");
          pre.textContent = text;
          candidateModalBody.appendChild(pre);
        } else if (window.marked) {
          const prepared = prepareMarkdownForMath(text);
          candidateModalBody.innerHTML = window.marked.parse(prepared);
        } else {
          candidateModalBody.textContent = text;
        }
        resetModalScroll(candidateModalBody, candidateModalContent);
        candidateModal.hidden = false;
        if (!renderAsCode && window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise([candidateModalBody]).then(() => {
            resetModalScroll(candidateModalBody, candidateModalContent);
          });
        }
      }

      async function openCandidateModalFromUrl(number, url, title) {
        if (!number || !url) return;
        const cached = candidateCache.get(number);
        if (cached) {
          openCandidateModal(cached, title);
          return;
        }
        setStatus(`Loading candidate solution for problem ${number}...`);
        try {
          const text = await fetchGithubText(url);
          candidateCache.set(number, text);
          openCandidateModal(text, title);
          setStatus(`Loaded candidate solution for problem ${number}.`);
        } catch (error) {
          console.error(error);
          setStatus(`Failed to load candidate solution for problem ${number}.`);
        }
      }

      function shouldRenderAsCode(url) {
        if (!url) return false;
        return url.toLowerCase().endsWith(".lean");
      }

      async function openFileModalFromUrl(number, url, title, statusLabel) {
        if (!number || !url) return;
        const cacheKey = `${number}:${url}`;
        const cached = candidateCache.get(cacheKey);
        const renderAsCode = shouldRenderAsCode(url);
        if (cached) {
          openCandidateModal(cached, title, { renderAsCode });
          return;
        }
        setStatus(`Loading ${statusLabel} for problem ${number}...`);
        try {
          const text = await fetchGithubText(url);
          candidateCache.set(cacheKey, text);
          openCandidateModal(text, title, { renderAsCode });
          setStatus(`Loaded ${statusLabel} for problem ${number}.`);
        } catch (error) {
          console.error(error);
          setStatus(`Failed to load ${statusLabel} for problem ${number}.`);
        }
      }

      function closeCandidateModal() {
        candidateModal.hidden = true;
        candidateModalTitle.textContent = "";
        candidateModalBody.textContent = "";
        if (candidateModalCopy) {
          candidateModalCopy.hidden = true;
        }
      }

      async function copyCandidateModalText() {
        const text = candidateModalBody?.innerText || "";
        if (!text) return;
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            document.body.removeChild(textarea);
          }
          setStatus("Copied modal content.");
        } catch (error) {
          console.error(error);
          setStatus("Failed to copy modal content.");
        }
      }

        const valueEl = document.createElement("div");

        if (content instanceof Node) {
          valueEl.appendChild(content);
        } else {
          valueEl.textContent = content ?? "";
        }
        item.appendChild(labelEl);
        item.appendChild(valueEl);
        return item;

      async function renderNextBatch({ triggeredByScroll = false } = {}) {
        if (isRendering) return;
        if (renderedCount >= mergedRecords.length) return;
        isRendering = true;
        isScrollTriggered = triggeredByScroll;
        const isInitialBatch = !hasRenderedOnce;
        const nextBatch = mergedRecords.slice(
          renderedCount,
          renderedCount + batchSize,
        );
        renderedCount += nextBatch.length;
        updateStatus();
        await new Promise((resolve) => requestAnimationFrame(resolve));
        renderRows(nextBatch, true);
        if (isInitialBatch) {
          hasRenderedOnce = true;
        }
        if (window.MathJax && window.MathJax.typesetPromise) {
          await window.MathJax.typesetPromise();
        }
        isScrollTriggered = false;
        updateStatus();
        isRendering = false;
      }

      async function render() {
        if (isLoading) {
          pendingRender = true;
          return;
        }
        isLoading = true;
        pendingRender = false;
        try {
          setStatus("");
          if (toastStatusEl) {
            toastStatusEl.textContent = "Loading problems...";
            toastStatusEl.classList.add("is-visible");
          }
          await new Promise((resolve) => requestAnimationFrame(resolve));
          const response = await fetch(problemsUrl);
          if (!response.ok) {
            setStatus("Failed to load problems.yaml.");
            return;
          }
          const yamlText = await response.text();
          const problems = window.jsyaml.load(yamlText);
          if (!Array.isArray(problems)) {
            setStatus("problems.yaml did not parse to a list.");
            return;
          }

          const unsolvedResponse = await fetch(unsolvedUrl);
          if (!unsolvedResponse.ok) {
            setStatus("Failed to load unsolved.jsonl from server.");
            return;
          }
          const jsonlText = await unsolvedResponse.text();
          const parsed = parseJsonl(jsonlText, Number.POSITIVE_INFINITY);
          const jsonlRecords = parsed.records;
          const jsonlTotal = parsed.total;

          let manifestEntries = [];
          const solutionsDir = await fetchGithubJson(solutionsBasePath);
          const solutionNumbers = new Set(
            Array.isArray(solutionsDir)
              ? solutionsDir
                  .filter((entry) => entry?.type === "dir")
                  .map((entry) => String(entry.name))
              : [],
          );

          const manifestText = await fetchGithubText(manifestPath);
          const manifestData = JSON.parse(manifestText);
          manifestEntries = parseManifestEntries(manifestData);
          const solutionsMap = buildSolutionsMap(manifestEntries);

          const unsolvedMap = new Map(
            jsonlRecords.map((record) => [String(record.number), record]),
          );

          const allowedStates = new Set(["open", "falsifiable", "verifiable"]);
          const merged = [];
          for (const problem of problems) {
            const number = String(problem.number ?? "");
            const state = problem.status?.state ?? "";
            if (!allowedStates.has(state)) {
              continue;
            }
            const match = unsolvedMap.get(number);
            const solution = solutionsMap.get(number);
            merged.push({
              number,
              state,
              in_manifest: solutionsMap.has(number),
              latex: match?.latex ?? "",
              additional_text: match?.additional_text ?? "",
              prior_solution_found: solution?.priorSolutionFound ?? "",
              deep_research_response: solution?.deepResearchResponse ?? "",
              deep_research_pdf_url: solution?.deepResearchPdfUrl ?? "",
              deep_research_share_url: solution?.deepResearchShareUrl ?? "",
              solution_manually_verified: solution?.solutionManuallyVerified ?? "",
              solution_manual_review_reason:
                solution?.solutionManualReviewReason ?? "",
              solution_manual_reviewer: solution?.solutionManualReviewer ?? "",
              pro_response: solution?.proResponse ?? "",
              solution_share_url: solution?.solutionShareUrl ?? "",
              prompter: solution?.prompter ?? "",
              aristotle_status: solution?.aristotleStatus ?? "",
              aristotle_proof_url: solution?.aristotleProofUrl ?? "",
              candidate_solution_url: solutionNumbers.has(number)
                ? solution?.candidateSolutionUrl ?? ""
                : "",
            });
          }

          allRecords = merged;
          mergedRecords = applyFilters(allRecords);
          renderRows([]);
          const jsonlStatus = `Loaded from server (${jsonlRecords.length} of ${jsonlTotal} JSONL rows).`;
          const manifestStatus = `Loaded ${manifestEntries.length} manifest entries from GitHub.`;
          const candidateStatus =
            "Candidate solutions load from GitHub when you click View.";
          jsonlStatusText = jsonlStatus;
          manifestStatusText = manifestStatus;
          candidateStatusText = candidateStatus;
          updateStatus();
          await renderNextBatch();
        } catch (error) {
          console.error(error);
          setStatus("Failed to parse files.");
        } finally {
          isLoading = false;
          if (pendingRender) {
            pendingRender = false;
            render();
          }
        }
      }

      });
      window.addEventListener("DOMContentLoaded", () => {
        if (branchInput) {
          branchInput.value = githubRef;
        }
        render();
      });
      function applyFiltersAndRender() {
        if (isLoading || allRecords.length === 0) {
          return;
        }
        mergedRecords = applyFilters(allRecords);
        resetRenderStatePreservingRecords();
        renderRows([]);
        updateStatus();
        renderNextBatch();
      }

      if (manifestFilter) {
        manifestFilter.addEventListener("change", () => {
          applyFiltersAndRender();
        });
      }
      if (filterPriorSolution) {
        filterPriorSolution.addEventListener("change", () => {
          applyFiltersAndRender();
        });
      }
      if (filterManualReview) {
        filterManualReview.addEventListener("change", () => {
          applyFiltersAndRender();
        });
      }
      if (filterPrompter) {
        filterPrompter.addEventListener("input", () => {
          applyFiltersAndRender();
        });
      }
      if (filterAristotle) {
        filterAristotle.addEventListener("change", () => {
          applyFiltersAndRender();
        });
      }
      if (branchForm) {
        branchForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const nextRef = branchInput?.value?.trim() || "main";
          if (nextRef === githubRef) return;
          githubRef = nextRef;
          candidateCache.clear();
          manifestStatusText = "";
          candidateStatusText = "";
          resetRenderState();
          setStatus(`Switching to branch ${githubRef}...`);
          render();
        });
      }
    </script>
  </body>
</html>
